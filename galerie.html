<!doctype html>
<html lang="fr-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Votre galerie privée | Behn J. Productions</title>
    <meta name="description" content="Galerie privée — choisissez vos photos préférées." />

    <!-- Les galeries et le panneau ne doivent jamais se retrouver dans Google. -->
    <meta name="robots" content="noindex, nofollow" />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#080808" />

    <!-- Aperçu du lien dans WhatsApp, iMessage, Messenger et compagnie.
         Volontairement neutre : le lien d'une galerie se partage souvent par
         messagerie, et la vignette est visible sans mot de passe. Aucune photo
         du client ne doit s'y trouver, ni son nom. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Behn J. Productions" />
    <meta property="og:title" content="Votre galerie privée" />
    <meta property="og:description" content="Vos photos vous attendent. Ouvrez la galerie pour choisir vos préférées." />
    <meta property="og:image" content="https://behnjproductions.ca/assets/og-galerie.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="fr_CA" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Votre galerie privée" />
    <meta name="twitter:description" content="Vos photos vous attendent. Ouvrez la galerie pour choisir vos préférées." />
    <meta name="twitter:image" content="https://behnjproductions.ca/assets/og-galerie.jpg" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
